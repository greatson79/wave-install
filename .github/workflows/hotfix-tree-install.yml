name: Hotfix fresh install from this tree (login STUBBED, steps 1-7 gate)

on:
  workflow_dispatch:
  push:
    branches: ['hotfix/**']

permissions:
  contents: read

jobs:
  tree-install:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fresh profile + Claude stub
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Needs Windows PowerShell 5.1' }
          $minimum = [string](Get-Content steps.json -Raw -Encoding UTF8 | ConvertFrom-Json).tooling.claude_code_min_version
          $profile = Join-Path $env:RUNNER_TEMP ('tree-home-' + [guid]::NewGuid().ToString('N'))
          $stubs = Join-Path $profile 'stubs'
          New-Item -ItemType Directory -Force -Path $stubs | Out-Null
          @('@echo off', 'if "%~1"=="--version" ( echo ' + $minimum + ' & exit /b 0 )', 'if "%~1 %~2"=="auth status" exit /b 0', 'echo Claude is STUBBED: %* 1>&2', 'exit /b 99') -join "`r`n" |
            Set-Content -Encoding ASCII (Join-Path $stubs 'claude.cmd')
          $stubs | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          @("USERPROFILE=$profile", "HOME=$profile", "WAVE_HOME=$(Join-Path $profile '.wave')", 'WAVE_NO_PROGRESS=1') | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run this tree's bootstrap.ps1 (not the live /win)
        id: run
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $PWD 'bootstrap.ps1')
          Write-Host "bootstrap exit: $LASTEXITCODE"
          exit 0
      - name: Gate S00-S06 passed; record S07+ (needs real Claude)
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -LiteralPath (Join-Path $env:WAVE_HOME 'install-state.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $log = Join-Path $env:WAVE_HOME 'install.log'
          Get-Content -LiteralPath $log -Tail 40 -Encoding UTF8 | ForEach-Object { Write-Host "LOG| $_" }
          $failed = @()
          foreach ($id in @('S00_PREFLIGHT','S01_CLAUDE_INSTALL','S02_CLAUDE_LOGIN','S03_DOWNLOAD_VERIFY','S04_INSTALL_LINK','S06_PACK_INSTALL','S05_DAEMON_REGISTER')) {
            $s = $state.steps.$id
            Write-Host ("{0} = {1}" -f $id, $s.status)
            if ($s.status -ne 'passed') { $failed += $id }
          }
          foreach ($id in @('S07_INITIAL_FLEET','S08_VERIFY','S09_COMPLETE')) { Write-Host ("{0} = {1} (outside gate: real Claude seats needed)" -f $id, $state.steps.$id.status) }
          if (-not (Select-String -LiteralPath $log -Pattern 'setup exit: 0' -Quiet)) { $failed += 'no setup exit 0 line' }
          if ($failed.Count) { throw ('GATE FAIL: ' + ($failed -join ', ')) }
          Write-Host 'GATE PASS: steps 1-7 passed from this tree (login stubbed)'
