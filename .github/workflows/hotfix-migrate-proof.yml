name: Hotfix add-on migration proof

on:
  push:
    branches: ['hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove PS 5.1 migration and starter Y/N/SHA-mismatch paths
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Requires Windows PowerShell 5.1' }
          $env:MIGRATE_ENGINE = 'powershell'
          python -m unittest discover -s tests -p test_migrate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove Bash piped yes, dry-run, no-tty and site assembly
        shell: bash
        run: |
          /bin/bash --version
          python3 -m unittest discover -s tests -p test_migrate.py -v
      - name: Assemble migration site and verify pinned file checksums
        shell: bash
        run: |
          bash scripts/assemble-migrate-site.sh "$RUNNER_TEMP/migrate-site"
          cd "$RUNNER_TEMP/migrate-site"
          shasum -a 256 -c SHA256SUMS-migrate
