name: Installer 0.3.5 full suite before and after (PowerShell 5.1)
on:
  workflow_dispatch:
  push:
    branches: ['hotfix/0.3.5-installer']
permissions:
  contents: read
jobs:
  unit-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, hotfix]
    env:
      PYTHONUTF8: '1'
      WAVE_NO_PROGRESS: '1'
      WAVE_TEST_SCOPE: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.phase == 'baseline' && 'c5dc5f18bdb59b117a4b78edd46a782148e3cb65' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test-only dependency
        shell: powershell
        run: |
          python -m pip install -r tests/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
      - name: Same full discovery and explicit Windows-applicable suite (C6)
        shell: powershell
        env:
          SUITE_PHASE: ${{ matrix.phase }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.ToString() -notlike '5.1.*') { throw 'Requires PS 5.1' }
          $env:PWSH = (Get-Command powershell).Source
          @'
          import json, os, sys, unittest
          from pathlib import Path
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          summary = dict(phase=os.environ['SUITE_PHASE'], tests=result.testsRun,
                         failures=len(result.failures), errors=len(result.errors),
                         failure_ids=sorted(t.id() for t, _ in result.failures),
                         error_ids=sorted(t.id() for t, _ in result.errors),
                         skipped=len(result.skipped), success=result.wasSuccessful())
          if summary['phase'] == 'hotfix':
              modules = ['tests.' + p.stem for p in sorted(Path('tests').glob('test_windows_*.py'))]
              modules += ['tests.' + name for name in (
                  'test_login_config_dir_win_w46', 'test_help_client', 'test_help_client_windows',
                  'test_help_redaction', 'test_hotfix_av', 'test_hotfix_coverage_gate', 'test_installer035',
                  'test_installer_launch_gate', 'test_join', 'test_workflow_contract',
                  'test_release_hotfix_wiring', 'test_suite_comparison') if 'tests.' + name not in modules]
              modules += ['tests.test_g8r1_regressions.' + name for name in (
                  'WindowsProgressAndPackTests', 'RedactBeforeTruncateTests', 'StepsAndNoticeTextTests')]
              applicable = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(modules))
              summary.update(applicable_modules=modules, applicable_tests=applicable.testsRun,
                             applicable_skipped=len(applicable.skipped), applicable_success=applicable.wasSuccessful(),
                             applicable_skip_details=[dict(test=t.id(), reason=reason) for t, reason in applicable.skipped],
                             applicable_failure_ids=sorted(t.id() for t, _ in applicable.failures + applicable.errors))
          Path('suite-summary.json').write_text(json.dumps(summary, indent=2))
          print('SUITE_SUMMARY=' + json.dumps(summary))
          # Raw failures are judged by test-id set comparison, never silently ignored.
          sys.exit(0)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Suite evidence collection failed' }
      - name: Source gates (hotfix only; baseline is the negative control)
        if: matrix.phase == 'hotfix'
        shell: powershell
        run: |
          $env:PWSH = (Get-Command powershell).Source
          python scripts/check-installer-launch.py .
          if ($LASTEXITCODE -ne 0) { throw 'Launch gate failed' }
          python scripts/check-hotfix-coverage.py
          if ($LASTEXITCODE -ne 0) { throw 'Historical hotfix coverage failed' }
          python tests/ps-balance.py --all
          if ($LASTEXITCODE -ne 0) { throw 'Encoding/delimiter check failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer035-${{ matrix.phase }}-counts
          path: suite-summary.json
  compare:
    needs: unit-suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer035-*-counts
          path: counts
      - name: No new raw failures and Windows-applicable suite green
        shell: powershell
        run: |
          python scripts/ci/compare-installer-suites.py counts/installer035-baseline-counts/suite-summary.json counts/installer035-hotfix-counts/suite-summary.json
          if ($LASTEXITCODE -ne 0) { throw 'C6 suite comparison failed' }
