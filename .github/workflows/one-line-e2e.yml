name: Standard-user Windows install boundaries
on:
  workflow_dispatch:
  push:
    branches: ['e2e/**', 'fix/v0.2.3', 'fix/v0.2.4']
permissions:
  contents: read
jobs:
  windows-nonadmin:
    name: Windows PowerShell 5.1 / ${{ matrix.mode }} / standard user
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [published, post-login]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse PowerShell scripts with the Windows 5.1 parser
        shell: powershell
        run: |
          foreach ($file in @('scripts/ci/nonadmin-driver.ps1', 'scripts/ci/nonadmin-child.ps1', 'bootstrap.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Create fresh standard user and execute isolated installer test
        shell: powershell
        run: ./scripts/ci/nonadmin-driver.ps1 -Mode '${{ matrix.mode }}'
      - name: Upload identity, exact command, state, logs and denial control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonadmin-${{ matrix.mode }}-${{ github.sha }}
          path: ci-evidence/${{ matrix.mode }}/
          if-no-files-found: error
